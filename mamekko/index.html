<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マメッコ 分析・PDCA</title>
<style>
:root{--navy:#1a1a2e;--navy2:#242447;--accent:#e94560;--bg:#f5f7fa;--card:#fff;--text:#1a1a2e;--sub:#6b7280;--line:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.app{display:flex;min-height:100vh}
aside{width:210px;flex-shrink:0;background:var(--navy);color:#fff;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 18px 14px;font-size:1.1rem;font-weight:700}
.brand span{color:var(--accent)}
nav a{display:flex;gap:8px;align-items:center;padding:9px 18px;color:#cbd5e1;text-decoration:none;font-size:.88rem;border-left:3px solid transparent}
nav a:hover{background:var(--navy2);color:#fff}
nav a.active{background:var(--navy2);color:#fff;border-left-color:var(--accent);font-weight:600}
.side-meta{padding:14px 18px;font-size:.7rem;color:#8b93a7}
main{flex:1;padding:20px;max-width:1100px;min-width:0}
h1{font-size:1.3rem;margin-bottom:4px}
.sub{font-size:.8rem;color:var(--sub);margin-bottom:16px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.05);padding:20px;margin-bottom:16px}
.card h2{font-size:1.02rem;margin-bottom:10px}
.card .note{font-size:.75rem;color:var(--sub);margin:-6px 0 12px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.05);padding:14px 16px}
.kpi .label{font-size:.72rem;color:var(--sub)}
.kpi .value{font-size:1.4rem;font-weight:700;margin-top:2px}
.kpi .delta{font-size:.75rem;font-weight:600;margin-top:2px}
.up{color:#059669}.down{color:#dc2626}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem;white-space:nowrap}
th{text-align:left;font-size:.7rem;color:var(--sub);font-weight:600;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 10px 8px 0;border-bottom:1px solid #f3f4f6;vertical-align:top}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafbfc}
.pt{font-weight:600;max-width:15em;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.diag{font-size:.72rem;color:#9ca3af;white-space:normal;max-width:22em;margin-top:2px}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.v-hit{background:#d1fae5;color:#059669}.v-good{background:#ecfdf5;color:#10b981}.v-mid{background:#f3f4f6;color:#6b7280}.v-weak{background:#fef3c7;color:#d97706}.v-miss{background:#fee2e2;color:#dc2626}.v-na{background:#f3f4f6;color:#9ca3af}
.item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.item .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .date{font-size:.75rem;color:var(--sub)}
.item .title{font-weight:600}
.item .hyp{font-size:.83rem;color:var(--sub);margin-top:4px}
.item .check{font-size:.85rem;margin-top:4px}
.num{color:var(--accent);font-weight:700}
.actions li{list-style:none;display:flex;gap:8px;padding:6px 0;font-size:.88rem;border-bottom:1px solid #f3f4f6}
.actions li:last-child{border-bottom:none}
.actions .arrow{color:var(--accent);font-weight:700;flex-shrink:0}
.slots{display:flex;flex-wrap:wrap;gap:10px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.slot .t{font-weight:700}
.slot .d{font-size:.7rem;color:var(--sub);margin-top:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.legend{font-size:.78rem;color:var(--sub)}
.legend li{margin:4px 0 4px 1.2em}
.empty{color:#9ca3af;font-size:.85rem;padding:12px 0}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:.8rem;font-weight:600;cursor:pointer}
.btn:hover{opacity:.88}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:3px 10px;font-size:.72rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=month]{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:.82rem;background:#fff;color:var(--text)}
.chart{width:100%;overflow-x:auto}
.bar{fill:#c7d2fe;cursor:pointer}
.bar:hover,.bar.sel{fill:var(--accent)}
.axis{font-size:9px;fill:#9ca3af}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.cmp-grid{grid-template-columns:1fr}}
.cmp-head{font-weight:700;font-size:.9rem;margin-bottom:6px}
.stat-row{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-bottom:1px solid #f3f4f6}
.stat-row .k{color:var(--sub)}
.dif{font-size:.75rem;font-weight:700;margin-left:6px}
#modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
#modal{display:none;position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:22px;width:min(640px,92vw);max-height:86vh;overflow-y:auto}
#modal h3{font-size:1rem;margin-bottom:10px;padding-right:30px}
#modal .close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--sub)}
textarea{width:100%;height:280px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre;color:var(--text)}
.mrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin:8px 0}
.mrow div b{display:block;font-size:1.05rem}
#error{display:none;margin:14px 0;padding:16px;background:#fee2e2;color:#b91c1c;border-radius:12px;font-size:.88rem}
.mobile-note{display:none}
@media(max-width:760px){
.app{flex-direction:column}
aside{width:100%;height:auto;position:static;padding:10px 0}
.brand{padding:4px 14px 8px}
nav{display:flex;overflow-x:auto;gap:2px;padding:0 8px}
nav a{border-left:none;border-bottom:3px solid transparent;padding:7px 10px;white-space:nowrap}
nav a.active{border-left:none;border-bottom-color:var(--accent)}
.side-meta{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">マメッコ<span>分析</span></div>
<nav id="nav"></nav>
<div class="side-meta" id="meta"></div>
</aside>
<main>
<div id="error"></div>
<div id="view"></div>
</main>
</div>
<div id="modal-bg" onclick="closeModal()"></div>
<div id="modal"><button class="close" onclick="closeModal()">✕</button><div id="modal-body"></div></div>
<script>
"use strict";
const fmt=n=>n==null?"—":Number(n).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const pct=(n,d=2)=>n==null?"—":n.toFixed(d)+"%";
const idx=n=>n==null?"—":n.toFixed(2);
const signed=n=>n==null?"±?":(n>=0?"+":"")+fmt(n);
const vclass={"当たり":"v-hit","良好":"v-good","普通":"v-mid","弱い":"v-weak","外れ":"v-miss"};
const vb=v=>'<span class="badge '+(vclass[v]||"v-na")+'">'+esc(v||"判定不能")+"</span>";
let R=null,P=null;
const VIEWS=[
{id:"home",icon:"📌",label:"今週やること"},
{id:"score",icon:"📊",label:"スコアカード"},
{id:"reuse",icon:"🔁",label:"横展開・再投稿"},
{id:"compare",icon:"🕰",label:"時代比較"},
{id:"groups",icon:"🎯",label:"テーマ・型"},
{id:"pdca",icon:"✅",label:"PDCA検証"},
{id:"knowledge",icon:"📚",label:"ナレッジ検証"},
{id:"times",icon:"⏰",label:"ベスト時間"},
];
async function boot(){
document.getElementById("nav").innerHTML=VIEWS.map(v=>'<a href="#'+v.id+'" data-v="'+v.id+'"><span>'+v.icon+"</span>"+v.label+"</a>").join("");
try{
const res=await fetch("./report.json?t="+Date.now());
if(!res.ok)throw new Error("HTTP "+res.status);
R=await res.json();
}catch(e){
const el=document.getElementById("error");
el.style.display="block";
el.textContent="report.jsonを読み込めませんでした。npm run analyze:publish でデータを生成してください（"+e.message+"）";
return;
}
try{
const res=await fetch("./posts.json?t="+Date.now());
if(res.ok)P=(await res.json()).posts;
}catch(e){P=null}
document.getElementById("meta").innerHTML="直近"+R.recentDays+"日<br>更新: "+new Date(R.generatedAt).toLocaleString("ja-JP")+(P?"<br>全"+P.length+"投稿":"");
window.addEventListener("hashchange",render);
render();
}
function cur(){const h=location.hash.replace("#","");return VIEWS.some(v=>v.id===h)?h:"home"}
function render(){
const id=cur();
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.v===id));
document.getElementById("view").innerHTML=({home,score,reuse,compare,groups,pdca,knowledge,times})[id]();
afterRender(id);
}
const needPosts='<div class="card"><div class="empty">全投稿データ（posts.json）がまだありません。<code>npm run analyze:publish</code>を実行すると生成されます。</div></div>';
function home(){
const h=R.health;
const trend=h.reachTrendPct!=null?'<div class="delta '+(h.reachTrendPct>=0?"up":"down")+'">'+(h.reachTrendPct>=0?"+":"")+h.reachTrendPct.toFixed(1)+"% 前期比</div>":"";
const todos=R.weeklyTodo||[];
return '<h1>今週やること</h1><div class="sub">最新の状態と、見た後にやるべきこと</div>'
+'<div class="kpi-grid">'
+kpi("フォロワー",fmt(h.latestFollowers),h.followersDelta28d!=null?'<div class="delta '+(h.followersDelta28d>=0?"up":"down")+'">28日 '+signed(h.followersDelta28d)+"</div>":"")
+kpi("日次リーチ28日平均",fmt(h.avgDailyReachRecent),trend)
+kpi("リンククリック（28日計）",fmt(h.websiteClicks28d),h.websiteClicksPrev28d!=null?'<div class="delta">前28日: '+fmt(h.websiteClicksPrev28d)+"</div>":"")
+kpi("LINE友だち",h.lineFriends!=null?fmt(h.lineFriends):"未記録",h.lineFriendsDelta28d!=null?'<div class="delta '+(h.lineFriendsDelta28d>=0?"up":"down")+'">28日 '+signed(h.lineFriendsDelta28d)+"</div>":"")
+kpi("フォロワー増減（7日）",signed(h.followersDelta7d),"")
+kpi("投稿頻度（週平均）",h.avgPostsPerWeek.toFixed(1)+"本","")
+"</div>"
+'<div class="card"><h2>今週やること（優先度順）</h2><p class="note">終わったら次週のレポートで効果を確認</p>'
+(todos.length?todos.map((t,i)=>'<div class="item"><div class="head"><span class="num">'+(i+1)+'.</span><span class="title">'+esc(t.title)+'</span></div><div class="hyp">'+esc(t.reason)+"</div>"+t.steps.map(s=>'<div class="check">☐ '+esc(s)+"</div>").join("")+"</div>").join(""):'<div class="empty">特になし。当たりの型を再現しつつ通常運転でOK</div>')
+"</div>"
+'<div class="card"><h2>その他の気づき</h2><ul class="actions">'+(R.actions||[]).map(a=>'<li><span class="arrow">→</span><span>'+bold(a)+"</span></li>").join("")+"</ul></div>"
+'<div class="card"><h2>指標の見方</h2><ul class="legend">'
+"<li><strong>リーチ指数</strong>: そのリーチ÷直前同タイプ投稿の中央値。「今の地力」基準なので過去バズに引きずられない。1.5以上=当たり、0.6未満=外れ</li>"
+"<li><strong>保存率</strong>: 保存÷リーチ。新規に刺さる度合い。ERより成長と相関が強い</li>"
+"<li><strong>フォロー率</strong>: フォロー÷リーチ。アカウント成長への直接貢献</li>"
+"<li>ERはフォロワーのいいねで嵩上げされるため参考程度に</li></ul></div>";
}
function kpi(label,value,extra){return '<div class="kpi"><div class="label">'+label+'</div><div class="value">'+value+"</div>"+(extra||"")+"</div>"}
function score(){
const rows=R.scorecard||[];
return '<h1>スコアカード</h1><div class="sub">直近'+R.recentDays+'日の投稿。行をクリックで詳細と再現プラン</div>'
+'<div class="card"><div class="tablewrap"><table><thead><tr><th>日付</th><th>投稿</th><th>型</th><th>テーマ</th><th class="r">リーチ</th><th class="r">指数</th><th class="r">保存率</th><th class="r">フォロー</th><th>判定</th></tr></thead><tbody>'
+(rows.length?rows.map((s,i)=>'<tr class="click" data-sc="'+i+'"><td>'+esc(s.date)+'</td><td><span class="pt">'+esc(s.title)+"</span>"+(s.diagnosis.length?'<div class="diag">'+esc(s.diagnosis.join("／"))+"</div>":"")+"</td><td>"+esc(s.pattern)+"</td><td>"+esc(s.theme)+'</td><td class="r">'+fmt(s.reach)+'</td><td class="r"><strong>'+idx(s.reachIndex)+'</strong></td><td class="r">'+pct(s.saveRate)+'</td><td class="r">'+s.follows+"</td><td>"+vb(s.verdict)+"</td></tr>").join(""):'<tr><td colspan="9" class="empty">直近の投稿データがありません</td></tr>')
+"</tbody></table></div></div>";
}
let reuseState={theme:"",period:"all",sort:"follows"};
function reuse(){
if(!P)return '<h1>横展開・再投稿</h1>'+needPosts;
const themes=[...new Set(P.map(p=>p.theme))].sort();
return '<h1>横展開・再投稿</h1><div class="sub">全期間から実績のある投稿を探して再現プランを作る。行をクリックで詳細</div>'
+'<div class="card"><div class="filters">'
+'<select id="f-period"><option value="all">全期間</option><option value="90">直近90日</option><option value="365">直近1年</option><option value="old">1年以上前（過去の当たり）</option></select>'
+'<select id="f-theme"><option value="">全テーマ</option>'+themes.map(t=>'<option value="'+esc(t)+'">'+esc(t)+"</option>").join("")+"</select>"
+'<select id="f-sort"><option value="follows">フォロー数順</option><option value="followRate">フォロー率順</option><option value="saveRate">保存率順</option><option value="reachIndex">リーチ指数順</option><option value="reach">リーチ順</option><option value="date">新しい順</option></select>'
+'</div><div id="reuse-list"></div></div>';
}
function reuseList(){
let list=[...P];
const now=Date.now(),day=864e5;
const per=reuseState.period;
if(per==="90")list=list.filter(p=>now-new Date(p.date)<=90*day);
else if(per==="365")list=list.filter(p=>now-new Date(p.date)<=365*day);
else if(per==="old")list=list.filter(p=>now-new Date(p.date)>365*day);
if(reuseState.theme)list=list.filter(p=>p.theme===reuseState.theme);
const k=reuseState.sort;
list.sort(k==="date"?(a,b)=>b.date.localeCompare(a.date):(a,b)=>(b[k]??-1)-(a[k]??-1));
list=list.slice(0,30);
return '<div class="tablewrap"><table><thead><tr><th>日付</th><th>投稿</th><th>テーマ</th><th class="r">リーチ</th><th class="r">指数</th><th class="r">保存率</th><th class="r">フォロー</th><th>判定</th><th></th></tr></thead><tbody>'
+(list.length?list.map(p=>{
const gi=P.indexOf(p);
return '<tr class="click" data-p="'+gi+'"><td>'+esc(p.date)+'</td><td><span class="pt">'+esc(p.title)+"</span></td><td>"+esc(p.theme)+'</td><td class="r">'+fmt(p.reach)+'</td><td class="r"><strong>'+idx(p.reachIndex)+'</strong></td><td class="r">'+pct(p.saveRate)+'</td><td class="r">'+p.follows+"</td><td>"+vb(p.verdict)+'</td><td><button class="btn sm" data-plan="'+gi+'">再現プラン</button></td></tr>';
}).join(""):'<tr><td colspan="9" class="empty">該当する投稿がありません</td></tr>')
+"</tbody></table></div>";
}
let cmpState={aFrom:"",aTo:"",bFrom:"",bTo:"",selMonth:""};
function months(){return [...new Set(P.map(p=>p.month))].sort()}
function compare(){
if(!P)return '<h1>時代比較</h1>'+needPosts;
const ms=months();
if(!cmpState.aFrom){
const last=ms[ms.length-1];
cmpState.aFrom=ms[Math.max(0,ms.length-3)];cmpState.aTo=last;
const yAgo=ms.filter(m=>m<=addMonths(last,-12));
cmpState.bFrom=yAgo.length>=3?yAgo[yAgo.length-3]:ms[0];cmpState.bTo=yAgo.length?yAgo[yAgo.length-1]:ms[0];
}
const opt=v=>ms.map(m=>'<option value="'+m+'"'+(m===v?" selected":"")+">"+m+"</option>").join("");
return '<h1>時代比較</h1><div class="sub">今と過去（LINEが取れていた時期など）の差分を見る。月バーをクリックで当月の投稿へ</div>'
+'<div class="card"><h2>月別推移（クリックで掘り下げ）</h2><div class="chart" id="chart-follows"></div><p class="note">上=月合計フォロー数（投稿経由）／下=月中央値リーチ</p><div class="chart" id="chart-reach"></div><div id="month-drill"></div></div>'
+'<div class="card"><h2>期間比較</h2><div class="filters">A:<select id="c-af">'+opt(cmpState.aFrom)+'</select>〜<select id="c-at">'+opt(cmpState.aTo)+"</select>　vs　B:<select id=\"c-bf\">"+opt(cmpState.bFrom)+'</select>〜<select id="c-bt">'+opt(cmpState.bTo)+"</select></div><div id=\"cmp-body\"></div></div>";
}
function addMonths(ym,n){const[y,m]=ym.split("-").map(Number);const d=new Date(Date.UTC(y,m-1+n,1));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")}
function periodPosts(f,t){return P.filter(p=>p.month>=f&&p.month<=t)}
function stats(list){
const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
return{n:list.length,medReach:med(list.map(p=>p.reach)),saveRate:avg(list.map(p=>p.saveRate)),followRate:avg(list.map(p=>p.followRate)),follows:list.reduce((s,p)=>s+p.follows,0),hits:list.filter(p=>p.verdict==="当たり").length};
}
function themeAgg(list){
const m=new Map();
for(const p of list){if(!m.has(p.theme))m.set(p.theme,[]);m.get(p.theme).push(p)}
return[...m.entries()].map(([name,ps])=>({name,...stats(ps)})).sort((a,b)=>b.follows-a.follows);
}
function difBadge(a,b,goodUp=true){
if(a==null||b==null||b===0)return"";
const r=(a-b)/b*100;
const cls=(r>=0)===goodUp?"up":"down";
return'<span class="dif '+cls+'">'+(r>=0?"+":"")+r.toFixed(0)+"%</span>";
}
function cmpBody(){
const A=periodPosts(cmpState.aFrom,cmpState.aTo),B=periodPosts(cmpState.bFrom,cmpState.bTo);
const sa=stats(A),sb=stats(B);
const row=(k,va,vb2,dif)=>'<div class="stat-row"><span class="k">'+k+'</span><span>'+va+" ⇔ "+vb2+dif+"</span></div>";
const ta=themeAgg(A),tb=themeAgg(B);
const tbm=new Map(tb.map(t=>[t.name,t]));
return '<div class="cmp-grid"><div><div class="cmp-head">A: '+cmpState.aFrom+"〜"+cmpState.aTo+"（今）</div>"
+row("投稿数",sa.n,sb.n,"")+row("当たり本数",sa.hits,sb.hits,"")
+row("中央値リーチ",fmt(sa.medReach),fmt(sb.medReach),difBadge(sa.medReach,sb.medReach))
+row("平均保存率",pct(sa.saveRate),pct(sb.saveRate),difBadge(sa.saveRate,sb.saveRate))
+row("平均フォロー率",pct(sa.followRate,3),pct(sb.followRate,3),difBadge(sa.followRate,sb.followRate))
+row("合計フォロー",fmt(sa.follows),fmt(sb.follows),difBadge(sa.follows,sb.follows))
+'</div><div><div class="cmp-head">B: '+cmpState.bFrom+"〜"+cmpState.bTo+"（比較先）</div>"
+'<div class="tablewrap"><table><thead><tr><th>Bのテーマ</th><th class="r">本数</th><th class="r">フォロー</th><th class="r">今との比較</th></tr></thead><tbody>'
+tb.slice(0,8).map(t=>{
const a2=ta.find(x=>x.name===t.name);
return"<tr><td>"+esc(t.name)+'</td><td class="r">'+t.n+'</td><td class="r">'+t.follows+'</td><td class="r">'+(a2?"今"+a2.n+"本/フォロー"+a2.follows:"<strong>今ゼロ本</strong>")+"</td></tr>";
}).join("")
+"</tbody></table></div></div></div>"
+'<p class="note" style="margin-top:10px">Bで強かったテーマが今ゼロ本なら、それが横展開の第一候補。<a href="#reuse">横展開・再投稿</a>で「1年以上前」フィルタにすると当時の当たりが探せます</p>';
}
function barChart(id,data,fmtV){
const w=Math.max(560,data.length*34),h=120,bw=22;
const max=Math.max(...data.map(d=>d.v),1);
let s='<svg viewBox="0 0 '+w+" "+(h+26)+'" width="'+w+'" height="'+(h+26)+'">';
data.forEach((d,i)=>{
const bh=Math.round(d.v/max*(h-14));
const x=i*34+6,y=h-bh;
s+='<rect class="bar'+(d.m===cmpState.selMonth?" sel":"")+'" data-m="'+d.m+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'"><title>'+d.m+": "+fmtV(d.v)+"</title></rect>";
s+='<text class="axis" x="'+(x+bw/2)+'" y="'+(h+10)+'" text-anchor="middle">'+d.m.slice(2).replace("-","/")+"</text>";
if(bh>16)s+='<text class="axis" x="'+(x+bw/2)+'" y="'+(y-3)+'" text-anchor="middle">'+fmtV(d.v)+"</text>";
});
s+="</svg>";
document.getElementById(id).innerHTML=s;
}
function drawCharts(){
const ms=months();
const byM=m=>P.filter(p=>p.month===m);
barChart("chart-follows",ms.map(m=>({m,v:byM(m).reduce((s,p)=>s+p.follows,0)})),v=>fmt(v));
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
barChart("chart-reach",ms.map(m=>({m,v:med(byM(m).map(p=>p.reach))})),v=>fmt(v));
document.querySelectorAll(".bar").forEach(b=>b.addEventListener("click",()=>{cmpState.selMonth=b.dataset.m;drawCharts();monthDrill()}));
}
function monthDrill(){
const el=document.getElementById("month-drill");
if(!cmpState.selMonth){el.innerHTML="";return}
const list=P.filter(p=>p.month===cmpState.selMonth).sort((a,b)=>b.follows-a.follows);
el.innerHTML="<h2 style=\"margin-top:14px\">"+cmpState.selMonth+"の投稿（フォロー順）</h2><div class=\"tablewrap\"><table><thead><tr><th>日付</th><th>投稿</th><th>テーマ</th><th class=\"r\">リーチ</th><th class=\"r\">保存率</th><th class=\"r\">フォロー</th><th></th></tr></thead><tbody>"
+list.map(p=>{const gi=P.indexOf(p);return '<tr class="click" data-p="'+gi+'"><td>'+esc(p.date)+'</td><td><span class="pt">'+esc(p.title)+"</span></td><td>"+esc(p.theme)+'</td><td class="r">'+fmt(p.reach)+'</td><td class="r">'+pct(p.saveRate)+'</td><td class="r">'+p.follows+'</td><td><button class="btn sm" data-plan="'+gi+'">再現プラン</button></td></tr>'}).join("")
+"</tbody></table></div>";
bindPostRows(el);
}
function groups(){
const t=(R.themes||[]),pt=(R.patterns||[]);
const tbl=(stats,kind)=>'<div class="tablewrap"><table><thead><tr><th>分類</th><th class="r">本数</th><th class="r">中央値リーチ</th><th class="r">保存率</th><th class="r">フォロー率</th></tr></thead><tbody>'
+(stats.length?stats.map(s=>'<tr class="click" data-g="'+kind+":"+esc(s.name)+'"><td>'+esc(s.name)+'</td><td class="r">'+s.posts+'</td><td class="r">'+fmt(s.medianReach)+'</td><td class="r">'+pct(s.avgSaveRate)+'</td><td class="r">'+pct(s.avgFollowRate,3)+"</td></tr>").join(""):'<tr><td colspan="5" class="empty">データなし</td></tr>')
+"</tbody></table></div>";
return '<h1>テーマ・型</h1><div class="sub">過去90日の分類別成績。行をクリックで該当投稿一覧（全期間）</div>'
+'<div class="grid-2"><div class="card"><h2>テーマ別</h2>'+tbl(t,"theme")+'</div><div class="card"><h2>型別</h2>'+tbl(pt,"pattern")+"</div></div>"
+'<div id="group-drill"></div>';
}
function pdca(){
const rows=R.pdca||[];
return '<h1>PDCA検証</h1><div class="sub">仮説→実績の突き合わせ</div><div class="card">'
+(rows.length?rows.map(p=>{
let body="";
if(!p.matched)body='<div class="check"><span class="badge v-na">未投稿/未マッチ</span></div>';
else{
body=p.checks.map(c=>'<div class="check">'+(c.pass?"✅":"❌")+" "+esc(c.label)+": 目標"+c.target+" → 実績"+(Math.round(c.actual*100)/100)+"</div>").join("");
if(!p.checks.length)body='<div class="check empty">目標値未設定（target_reach_index等をプランに書くと自動判定）</div>';
if(p.diagnosis.length)body+='<div class="diag">'+esc(p.diagnosis.join("／"))+"</div>";
}
return '<div class="item"><div class="head"><span class="date">'+esc(p.date||"日付未定")+'</span><span class="title">'+esc(p.title||p.file)+"</span></div>"+(p.hypothesis?'<div class="hyp">仮説: '+esc(p.hypothesis)+"</div>":"")+body+"</div>";
}).join(""):'<div class="empty">プランファイルがありません。accounts/mamekko/pdca/に投稿プラン（_template.md参照）を置くと自動で実績と突き合わせます。横展開ページの「再現プラン」ボタンからも作れます。</div>')
+"</div>";
}
function knowledge(){
const kn=R.knowledge||[];
return '<h1>ナレッジ検証</h1><div class="sub">セミナーの学び（ルール）を適用した投稿と非適用投稿の比較。適用2本以上で判定</div><div class="card"><div class="tablewrap"><table><thead><tr><th>ルール</th><th>出典</th><th>指標</th><th class="r">適用</th><th class="r">適用平均</th><th class="r">非適用平均</th><th>判定</th></tr></thead><tbody>'
+(kn.length?kn.map(k=>{
const vc=k.verdict==="効いている"?"v-hit":k.verdict==="効いていない"?"v-miss":"v-na";
return"<tr><td>"+esc(k.title)+"</td><td>"+esc(k.source||"—")+"</td><td>"+esc(k.metricLabel)+'</td><td class="r">'+k.applied+'本</td><td class="r">'+(k.avgApplied!=null?k.avgApplied.toFixed(2):"—")+'</td><td class="r">'+(k.avgOthers!=null?k.avgOthers.toFixed(2):"—")+'</td><td><span class="badge '+vc+'">'+esc(k.verdict)+"</span></td></tr>";
}).join(""):'<tr><td colspan="7" class="empty">ナレッジがありません。accounts/mamekko/knowledge/にセミナーの学びをルール化して置くと自動判定されます（_template.md参照）</td></tr>')
+"</tbody></table></div></div>";
}
function times(){
const bt=R.bestTimes||[];
return '<h1>ベスト投稿時間（JST）</h1><div class="sub">過去90日・同一枠2投稿以上</div><div class="card"><div class="slots">'
+(bt.length?bt.slice(0,8).map(s=>'<div class="slot"><div class="t">'+esc(s.dayLabel)+"曜 "+s.hour+'時</div><div class="d">中央値リーチ '+fmt(s.medianReach)+"<br>保存率 "+s.avgSaveRate.toFixed(2)+"% ｜ "+s.posts+"投稿</div></div>").join(""):'<div class="empty">同一時間枠のサンプルがまだ足りません</div>')
+"</div></div>";
}
function afterRender(id){
if(id==="score"){
document.querySelectorAll("tr[data-sc]").forEach(tr=>tr.addEventListener("click",()=>scDetail(Number(tr.dataset.sc))));
}
if(id==="reuse"&&P){
const list=document.getElementById("reuse-list");
list.innerHTML=reuseList();bindPostRows(list);
["f-period","f-theme","f-sort"].forEach(fid=>{
const el=document.getElementById(fid);
el.value=fid==="f-period"?reuseState.period:fid==="f-theme"?reuseState.theme:reuseState.sort;
el.addEventListener("change",()=>{
reuseState={period:document.getElementById("f-period").value,theme:document.getElementById("f-theme").value,sort:document.getElementById("f-sort").value};
list.innerHTML=reuseList();bindPostRows(list);
});
});
}
if(id==="compare"&&P){
drawCharts();monthDrill();
document.getElementById("cmp-body").innerHTML=cmpBody();
[["c-af","aFrom"],["c-at","aTo"],["c-bf","bFrom"],["c-bt","bTo"]].forEach(([eid,key])=>{
document.getElementById(eid).addEventListener("change",e=>{cmpState[key]=e.target.value;document.getElementById("cmp-body").innerHTML=cmpBody()});
});
}
if(id==="groups"&&P){
document.querySelectorAll("tr[data-g]").forEach(tr=>tr.addEventListener("click",()=>{
const[kind,name]=tr.dataset.g.split(/:(.+)/);
const key=kind==="theme"?"theme":"pattern";
const list=P.filter(p=>p[key]===name).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
const el=document.getElementById("group-drill");
el.innerHTML='<div class="card"><h2>「'+esc(name)+'」の投稿（全期間・新しい順）</h2><div class="tablewrap"><table><thead><tr><th>日付</th><th>投稿</th><th class="r">リーチ</th><th class="r">指数</th><th class="r">保存率</th><th class="r">フォロー</th><th>判定</th><th></th></tr></thead><tbody>'
+list.map(p=>{const gi=P.indexOf(p);return '<tr class="click" data-p="'+gi+'"><td>'+esc(p.date)+'</td><td><span class="pt">'+esc(p.title)+"</span></td><td class=\"r\">"+fmt(p.reach)+'</td><td class="r">'+idx(p.reachIndex)+'</td><td class="r">'+pct(p.saveRate)+'</td><td class="r">'+p.follows+"</td><td>"+vb(p.verdict)+'</td><td><button class="btn sm" data-plan="'+gi+'">再現プラン</button></td></tr>'}).join("")
+"</tbody></table></div></div>";
bindPostRows(el);
el.scrollIntoView({behavior:"smooth"});
}));
}
}
function bindPostRows(root){
root.querySelectorAll("tr[data-p]").forEach(tr=>tr.addEventListener("click",e=>{
if(e.target.dataset.plan!==undefined)return;
postDetail(Number(tr.dataset.p));
}));
root.querySelectorAll("[data-plan]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();planModal(Number(b.dataset.plan))}));
}
function scDetail(i){
const s=R.scorecard[i];
openModal('<h3>'+esc(s.title)+"</h3>"
+'<div class="mrow"><div><span class="label">判定</span><b>'+esc(s.verdict)+'</b></div><div>リーチ<b>'+fmt(s.reach)+'</b></div><div>指数<b>'+idx(s.reachIndex)+'</b></div><div>保存率<b>'+pct(s.saveRate)+'</b></div><div>フォロー<b>'+s.follows+"</b></div></div>"
+"<p style=\"font-size:.85rem;color:var(--sub)\">"+esc(s.date)+"｜"+esc(s.pattern)+"｜"+esc(s.theme)+"</p>"
+(s.diagnosis.length?'<div style="margin:10px 0"><strong style="font-size:.85rem">診断</strong>'+s.diagnosis.map(d=>'<div class="check">・'+esc(d)+"</div>").join("")+"</div>":"")
+'<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'
+(s.permalink?'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(s.permalink)+'">Instagramで見る</a>':"")
+(P?'<button class="btn" onclick="planFromScorecard('+i+')">この投稿の再現プランを作る</button>':"")
+"</div>");
}
function planFromScorecard(i){
const s=R.scorecard[i];
const p=P&&P.find(x=>x.permalink&&x.permalink===s.permalink);
if(p)planModal(P.indexOf(p));
}
function postDetail(gi){
const p=P[gi];
openModal("<h3>"+esc(p.title)+"</h3>"
+'<div class="mrow"><div><span class="label">判定</span><b>'+esc(p.verdict)+'</b></div><div>リーチ<b>'+fmt(p.reach)+'</b></div><div>指数<b>'+idx(p.reachIndex)+'</b></div><div>保存率<b>'+pct(p.saveRate)+'</b></div><div>フォロー<b>'+p.follows+'</b></div><div>プロフ訪問<b>'+fmt(p.profileVisits)+"</b></div></div>"
+"<p style=\"font-size:.85rem;color:var(--sub)\">"+esc(p.date)+"｜"+esc(p.pattern)+"｜"+esc(p.theme)+"｜"+esc(p.mediaType)+"</p>"
+'<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'
+(p.permalink?'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(p.permalink)+'">Instagramで見る</a>':"")
+'<button class="btn" onclick="planModal('+gi+')">再現プランを作る</button></div>');
}
function planMd(p){
const d=new Date(Date.now()+3*864e5).toISOString().slice(0,10);
return"---\ndate: "+d
+"\ntitle: "+p.title+"（再現）"
+"\npattern: "+(p.pattern&&p.pattern!=="未分類"?p.pattern.charAt(0):"")
+"\ntheme: "+(p.theme!=="未分類"?p.theme:"")
+"\nhook: "
+"\nhypothesis: "+p.date+"の「"+p.title+"」がリーチ指数"+idx(p.reachIndex)+"・フォロー"+p.follows+"だったため、同じ型×テーマを今の切り口で再現すれば当たるはず"
+"\ntarget_reach_index: 1.2"
+"\ntarget_save_rate: "+(p.saveRate?Math.max(1,Math.round(p.saveRate*10)/10):1.5)
+"\ntarget_follows: "+Math.max(1,p.follows)
+"\nrules: "
+"\nig_media_id: "
+"\n---\n## 元投稿\n- "+(p.permalink||"リンクなし")+"（"+p.date+" リーチ"+fmt(p.reach)+" 保存率"+pct(p.saveRate)+" フォロー"+p.follows+"）"
+"\n## メモ\n- 丸ごと再投稿ではなく、1枚目フックと例えを今の時期・フォロワー層に合わせて更新する\n- 季節・天体イベントに依存していた場合は今の時期のイベントに置き換える\n";
}
function planModal(gi){
const p=P[gi];
const md=planMd(p);
const fname=new Date(Date.now()+3*864e5).toISOString().slice(0,10)+"-"+(p.title||"plan").replace(/[\\/:*?"<>|\s]+/g,"-").slice(0,20)+".md";
openModal("<h3>再現プラン: "+esc(p.title)+'</h3><p class="note" style="margin:0 0 8px">中身を編集して<code>accounts/mamekko/pdca/</code>に保存すると、投稿後に自動で仮説検証されます</p>'
+'<textarea id="plan-text">'+esc(md)+"</textarea>"
+'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="copyPlan()">コピー</button><button class="btn ghost" onclick="downloadPlan(\''+esc(fname)+'\')">.mdをダウンロード</button><span id="copy-ok" style="font-size:.8rem;color:#059669;display:none">コピーしました</span></div>');
}
function copyPlan(){
navigator.clipboard.writeText(document.getElementById("plan-text").value).then(()=>{
const ok=document.getElementById("copy-ok");ok.style.display="inline";setTimeout(()=>ok.style.display="none",2000);
});
}
function downloadPlan(fname){
const blob=new Blob([document.getElementById("plan-text").value],{type:"text/markdown"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;a.click();URL.revokeObjectURL(a.href);
}
function openModal(html){
document.getElementById("modal-body").innerHTML=html;
document.getElementById("modal").style.display="block";
document.getElementById("modal-bg").style.display="block";
}
function closeModal(){
document.getElementById("modal").style.display="none";
document.getElementById("modal-bg").style.display="none";
}
boot();
</script>
</body>
</html>
